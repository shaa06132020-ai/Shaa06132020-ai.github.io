<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Happy Birthday, Arif!</title>
<style>
  :root{
    --kraft: #c9a36c;
    --kraft-dark: #a9814f;
    --ink: #4a3222;
    --accent: #b23a3a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    overflow: hidden;
    background-color: var(--kraft);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.10), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(0,0,0,0.12), transparent 60%),
      linear-gradient(135deg, var(--kraft) 0%, var(--kraft-dark) 100%);
    background-blend-mode: multiply, normal, normal, normal;
  }
  #app{
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8vh;
  }

  /* ---------- COVER ---------- */
  #coverWrap{
    position: relative;
    width: min(78vw, 320px);
    transition: opacity 0.5s ease, transform 0.6s ease;
    cursor: pointer;
    user-select: none;
    z-index: 5;
  }
  #coverWrap.hidden{
    opacity: 0;
    transform: scale(0.85) translateY(10px);
    pointer-events: none;
  }
  .cover-card{
    width: 100%;
    display: block;
    border-radius: 4px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.15) inset;
    transform: rotate(-1.5deg);
    transition: transform 0.25s ease;
  }
  #coverWrap:active .cover-card{ transform: rotate(-1.5deg) scale(0.98); }
  .tap-hint{
    text-align: center;
    margin-top: 14px;
    font-size: 15px;
    color: #3a2a1a;
    opacity: 0.85;
    letter-spacing: 0.5px;
    animation: pulseHint 2.2s ease-in-out infinite;
  }
  @keyframes pulseHint{
    0%,100%{ opacity: 0.55; }
    50%{ opacity: 0.95; }
  }

  /* ---------- BOOK / SPREAD ---------- */
  #bookScene{
    position: absolute;
    top: 8vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 640px);
    display: flex;
    justify-content: center;
    perspective: 2200px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #bookScene.visible{
    opacity: 1;
    pointer-events: auto;
  }
  #spread{
    display: flex;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 944 / 709;
    position: relative;
  }
  .page{
    width: 50%;
    height: 100%;
    position: relative;
    background: #efe3c8;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
    overflow: hidden;
    transition: transform 0.85s cubic-bezier(.4,.2,.2,1);
    backface-visibility: hidden;
  }
  .left-page{
    border-radius: 6px 0 0 6px;
    transform-origin: right center;
    transform: rotateY(-95deg);
  }
  .right-page{
    border-radius: 0 6px 6px 0;
    transform-origin: left center;
    transform: rotateY(95deg);
  }
  #bookScene.visible .left-page{ transform: rotateY(0deg); }
  #bookScene.visible .right-page{ transform: rotateY(0deg); }
  #spine{
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 10px;
    margin-left: -5px;
    background: linear-gradient(90deg, rgba(0,0,0,0.25), rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.05) 60%, rgba(0,0,0,0.25));
    z-index: 3;
    pointer-events: none;
  }

  #backBtn{
    position: absolute;
    top: -46px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--kraft-dark);
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }
  #backBtn:hover{ background: #fff; }

  /* ---------- LEFT PAGE: LETTER ---------- */
  .letter-page-inner{
    position: relative;
    width: 100%;
    height: 100%;
  }
  .envelope-img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
  }
  .letter-pop{
    position: absolute;
    top: 23.98%;
    left: 15.89%;
    width: 30.30%;
    height: 47.95%;
    clip-path: polygon(0% 5.88%, 20.28% 0%, 100% 47.06%, 33.57% 100%, 0% 100%);
    transform: translate(0, 0);
    transition: top 0.55s cubic-bezier(.34,1.05,.4,1), left 0.55s cubic-bezier(.34,1.05,.4,1),
                width 0.55s cubic-bezier(.34,1.05,.4,1), height 0.55s cubic-bezier(.34,1.05,.4,1),
                clip-path 0.5s ease, box-shadow 0.4s ease;
    cursor: pointer;
    z-index: 4;
    overflow: hidden;
    box-shadow: none;
  }
  .letter-pop img{
    width: 150%;
    height: auto;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  .letter-pop.open{
    top: 8%;
    left: 8%;
    width: 84%;
    height: 84%;
    clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    box-shadow: 0 18px 40px rgba(0,0,0,0.5);
    z-index: 6;
  }
  .letter-pop.open img{
    height: 100%;
    width: auto;
    max-width: none;
    left: 50%;
    transform: translateX(-50%);
    object-fit: contain;
  }
  .letter-hint{
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 3px 10px;
    border-radius: 10px;
    pointer-events: none;
    opacity: 0.9;
  }

  /* ---------- RIGHT PAGE: CANDLES ---------- */
  .candle-page-inner{
    position: relative;
    width: 100%;
    height: 100%;
  }
  .cake-img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .flame{
    position: absolute;
    transform-origin: 50% 90%;
    transition: opacity 0.35s ease;
    filter: drop-shadow(0 0 6px rgba(255,180,60,0.55));
  }
  .flame.out{
    opacity: 0;
  }
  .flame.lit{
    animation: flicker 1.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ transform: rotate(-1.5deg) scale(1); }
    30%{ transform: rotate(1.5deg) scale(1.02); }
    60%{ transform: rotate(-1deg) scale(0.99); }
  }

  .mic-ui{
    position: absolute;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    width: 84%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 5;
  }
  .meter-track{
    width: 100%;
    height: 10px;
    background: rgba(0,0,0,0.18);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.25);
  }
  .meter-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#7bc67e,#f2c14e,#e2533f);
    transition: width 0.06s linear;
  }
  .mic-label{
    font-size: 10.5px;
    color: #4a3222;
    opacity: 0.75;
    text-align: center;
  }
  #fallbackBtn{
    margin-top: 2px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 20px;
    font-family: Georgia, serif;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    animation: fbPulse 1.6s ease-in-out infinite;
  }
  @keyframes fbPulse{
    0%,100%{ transform: scale(1); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    50%{ transform: scale(1.05); box-shadow: 0 6px 16px rgba(178,58,58,0.5); }
  }
  .https-note{
    font-size: 9px;
    line-height: 1.25;
    color: #4a3222;
    opacity: 0.55;
    text-align:center;
    max-width: 250px;
    margin-top: 1px;
  }

  .wish-overlay{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,250,235,0);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, background 0.5s ease;
    z-index: 7;
    text-align: center;
    padding: 20px;
  }
  .wish-overlay.show{
    opacity: 1;
    pointer-events: auto;
    background: rgba(255,250,235,0.55);
  }
  .wish-text{
    font-size: 22px;
    color: var(--accent);
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(255,255,255,0.8);
    margin-bottom: 14px;
  }
  #relightBtn{
    background: #fff;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 8px 18px;
    border-radius: 20px;
    font-family: Georgia, serif;
    cursor: pointer;
    font-size: 13px;
  }

  .confetti-piece{
    position: absolute;
    top: -10px;
    width: 8px;
    height: 14px;
    opacity: 0.95;
    z-index: 8;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); }
    100%{ transform: translateY(420px) rotate(540deg); opacity: 0.2; }
  }

  @media (max-width: 480px){
    .wish-text{ font-size: 18px; }
    #backBtn{ top: -40px; font-size: 12px; }
  }
</style>
</head>

          <div class="mic-ui">
            <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
            <div class="mic-label" id="micLabel">🎤 blow into your mic…</div>
            <button id="fallbackBtn">no mic? tap here to blow 💨</button>
            <div class="https-note">mic needs https hosting to work — button/spacebar always work</div>
          </div>

          <div class="wish-overlay" id="wishOverlay">
            <div class="wish-text">make a wish, cutie 🎂</div>
            <button id="relightBtn">relight candles</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
(function(){
  const coverWrap = document.getElementById('coverWrap');
  const bookScene = document.getElementById('bookScene');
  const backBtn = document.getElementById('backBtn');
  const letterPop = document.getElementById('letterPop');
  const letterHint = document.getElementById('letterHint');
  const envelopeImg = document.getElementById('envelopeImg');
  const flames = [document.getElementById('flame0'), document.getElementById('flame1'), document.getElementById('flame2')];
  const meterFill = document.getElementById('meterFill');
  const micLabel = document.getElementById('micLabel');
  const fallbackBtn = document.getElementById('fallbackBtn');
  const wishOverlay = document.getElementById('wishOverlay');
  const relightBtn = document.getElementById('relightBtn');
  const candlePage = document.getElementById('candlePage');

  // ---------- open / close book ----------
  function openBook(){
    coverWrap.classList.add('hidden');
    bookScene.classList.add('visible');
    startMic();
  }
  function closeBook(){
    bookScene.classList.remove('visible');
    coverWrap.classList.remove('hidden');
    letterPop.classList.remove('open');
    letterHint.style.opacity = '0.9';
    stopMic();
  }
  coverWrap.addEventListener('click', openBook);
  backBtn.addEventListener('click', closeBook);

  // ---------- letter ----------
  function toggleLetter(e){
    e.stopPropagation();
    const isOpen = letterPop.classList.toggle('open');
    letterHint.style.opacity = isOpen ? '0' : '0.9';
  }
  letterPop.addEventListener('click', toggleLetter);
  envelopeImg.addEventListener('click', function(e){
    if(!letterPop.classList.contains('open')){
      toggleLetter(e);
    }
  });

  // ---------- candles ----------
  let lit = [true, true, true];
  let audioCtx = null, analyser = null, micStream = null, rafId = null;
  let blowAccum = 0;
  let lastFrameTime = null;
  const BLOW_VOL_THRESHOLD = 0.045;
  const BEND_VOL_MAX = 0.22;
  const BLOW_DURATION_NEEDED = 500; // ms

  function anyLit(){ return lit.some(function(v){return v;}); }

  function extinguishAll(bendDeg){
    flames.forEach(function(f, i){
      if(!lit[i]) return;
      if(bendDeg){
        f.style.transform = 'rotate(' + bendDeg + 'deg)';
      }
      f.classList.remove('lit');
      f.classList.add('out');
      lit[i] = false;
    });
    setTimeout(showWish, 350);
  }

  function relight(){
    flames.forEach(function(f, i){
      f.classList.remove('out');
      f.classList.add('lit');
      f.style.transform = '';
      lit[i] = true;
    });
    wishOverlay.classList.remove('show');
    clearConfetti();
    blowAccum = 0;
    meterFill.style.width = '0%';
  }
  relightBtn.addEventListener('click', relight);

  function showWish(){
    wishOverlay.classList.add('show');
    burstConfetti();
  }

  function updateMeter(vol){
    const pct = Math.min(100, Math.round((vol / BEND_VOL_MAX) * 100));
    meterFill.style.width = pct + '%';
  }

  function bendFlames(vol){
    const t = Math.min(1, vol / BEND_VOL_MAX);
    const deg = t * 26;
    flames.forEach(function(f, i){
      if(!lit[i]) return;
      const dir = (i % 2 === 0) ? 1 : -1;
      f.style.transform = 'rotate(' + (dir * deg) + 'deg) scale(' + (1 - t*0.06) + ')';
    });
  }

  function resetFlameTransforms(){
    flames.forEach(function(f, i){
      if(lit[i]) f.style.transform = '';
    });
  }

  function processAudioFrame(now){
    if(!analyser){ return; }
    const data = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);
    let sumSquares = 0;
    for(let i=0;i<data.length;i++){
      const v = (data[i]-128)/128;
      sumSquares += v*v;
    }
    const rms = Math.sqrt(sumSquares/data.length);
    updateMeter(rms);

    if(!lastFrameTime) lastFrameTime = now;
    const dt = now - lastFrameTime;
    lastFrameTime = now;

    if(rms > BLOW_VOL_THRESHOLD && anyLit()){
      bendFlames(rms);
      blowAccum += dt;
      micLabel.textContent = '🎤 keep blowing…';
      if(blowAccum >= BLOW_DURATION_NEEDED){
        const finalDeg = 22;
        extinguishAll(finalDeg);
        blowAccum = 0;
      }
    } else {
      blowAccum = 0;
      if(anyLit()){
        resetFlameTransforms();
        micLabel.textContent = '🎤 blow into your mic…';
      }
    }

    rafId = requestAnimationFrame(processAudioFrame);
  }

  function startMic(){
    if(!anyLit()) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micUnavailable();
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        micStream = stream;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        source.connect(analyser);
        lastFrameTime = null;
        rafId = requestAnimationFrame(processAudioFrame);
      })
      .catch(function(err){
        micUnavailable();
      });
  }

  function micUnavailable(){
    micLabel.textContent = 'mic unavailable — use the button below';
    meterFill.style.width = '0%';
  }

  function stopMic(){
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    analyser = null;
    if(micStream){
      micStream.getTracks().forEach(function(t){ t.stop(); });
      micStream = null;
    }
    if(audioCtx){
      audioCtx.close().catch(function(){});
      audioCtx = null;
    }
    lastFrameTime = null;
    blowAccum = 0;
  }

  // fallback: instant blow-out
  function instantBlow(){
    if(!anyLit()) return;
    extinguishAll(20);
  }
  fallbackBtn.addEventListener('click', instantBlow);
  document.addEventListener('keydown', function(e){
    if(e.code === 'Space' && bookScene.classList.contains('visible')){
      e.preventDefault();
      instantBlow();
    }
  });

  // ---------- confetti ----------
  const confettiColors = ['#b23a3a','#e2533f','#f2c14e','#7bc67e','#5aa0d8','#c98bd6'];
  function burstConfetti(){
    for(let i=0;i<36;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random()*100) + '%';
      piece.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      piece.style.animationDuration = (1.4 + Math.random()*1.2) + 's';
      piece.style.animationDelay = (Math.random()*0.4) + 's';
      piece.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
      candlePage.appendChild(piece);
      (function(p){
        p.addEventListener('animationend', function(){ p.remove(); });
      })(piece);
    }
  }
  function clearConfetti(){
    candlePage.querySelectorAll('.confetti-piece').forEach(function(p){ p.remove(); });
  }

})();
</script>
